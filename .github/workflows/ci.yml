name: CI

# Roda a cada commit e a cada pull request, nos três sistemas operacionais exigidos.
on:
  push:
  pull_request:

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes de unidade com cobertura (mínimo de 80%)
        run: python -m pytest tests/unit --cov=app --cov-report=term-missing --cov-report=xml --cov-report=html --cov-fail-under=80

      - name: Instalar navegador do Playwright (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install chromium

      - name: Instalar navegador do Playwright (macOS e Windows)
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Testes end-to-end
        run: python -m pytest tests/e2e

      - name: Guardar relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.os }}
          path: |
            coverage.xml
            htmlcov/
